name: repo metadata

# The About box and the topic list are the two cheapest ranking signals GitHub
# gives a project, and both are easy to set once and then forget when they
# drift out of date. Keeping them here means they live with the README they
# have to agree with, and a change to either is a reviewable diff.
#
# Runs only when this file changes, or by hand. If the token is not allowed to
# edit repository settings the job says so and stops without failing the run --
# there is nothing to do about it from inside Actions, and a red badge on the
# repository would be misleading.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repo-metadata.yml']
  workflow_dispatch:

permissions:
  contents: read
  administration: write
  metadata: write

jobs:
  metadata:
    runs-on: ubuntu-latest

    steps:
      - name: Apply description, homepage and topics
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          DESCRIPTION="Keeps Windows awake only while the app you pick is actually working — then releases the lock by itself. 90 KB, single exe, no installer, no admin."
          HOMEPAGE="https://www.TakeYourSite.com"

          echo "Setting description and homepage..."
          gh api -X PATCH "repos/${{ github.repository }}" \
            -f description="$DESCRIPTION" \
            -f homepage="$HOMEPAGE" \
            --silent
          if [ $? -ne 0 ]; then
            echo "::warning::could not set the description - the Actions token is not allowed to edit repository settings. Set it by hand in the About box."
          fi

          echo "Setting topics..."
          gh api -X PUT "repos/${{ github.repository }}/topics" \
            -f names[]=windows \
            -f names[]=keep-awake \
            -f names[]=prevent-sleep \
            -f names[]=no-sleep \
            -f names[]=stay-awake \
            -f names[]=awake \
            -f names[]=caffeine \
            -f names[]=insomnia \
            -f names[]=power-management \
            -f names[]=sleep-mode \
            -f names[]=tray-application \
            -f names[]=systray \
            -f names[]=portable \
            -f names[]=no-installer \
            -f names[]=single-file \
            -f names[]=process-monitor \
            -f names[]=utility \
            -f names[]=automation \
            -f names[]=c \
            -f names[]=tinycc \
            --silent
          if [ $? -ne 0 ]; then
            echo "::warning::could not set topics - set them by hand from the gear beside the About box."
          fi

          echo "Current state:"
          gh api "repos/${{ github.repository }}" --jq '{description, homepage, topics}'
          exit 0
