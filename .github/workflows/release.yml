name: release

# Push a tag like v1.0.0 and this builds the executable from that exact commit
# and publishes it as a release, with its SHA-256 in the notes.
#
# The binary people download is therefore built by GitHub from public source,
# not uploaded by hand from someone's laptop -- which is the only version of
# "you can verify this" that means anything for an unsigned executable.
#
# The notes live in .github/release-notes.md rather than inline. A PowerShell
# here-string cannot survive a YAML block scalar: its closing "@ has to sit at
# column 0, and a line at column 0 ends the block.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch TinyCC
        shell: pwsh
        run: ./tools/get-tcc.ps1

      - name: Build and test
        shell: cmd
        run: build.cmd

      - name: Prepare the asset and its notes
        id: prep
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = $env:GITHUB_REF -replace '^refs/tags/','' }
          $version = $tag -replace '^v',''
          $asset = "WakeWhile-$version-windows-x64.exe"

          Copy-Item WakeWhile.exe $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          $size = [Math]::Round((Get-Item $asset).Length / 1KB, 1)

          $notes = Get-Content .github/release-notes.md -Raw
          $notes = $notes.Replace('__ASSET__', $asset)
          $notes = $notes.Replace('__SIZE__', $size)
          $notes = $notes.Replace('__HASH__', $hash)
          Set-Content notes.md $notes -Encoding utf8

          "tag=$tag"     | Out-File -Append $env:GITHUB_OUTPUT
          "asset=$asset" | Out-File -Append $env:GITHUB_OUTPUT
          "size: $size KB, sha-256: $hash"

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.prep.outputs.tag }}" "${{ steps.prep.outputs.asset }}" --title "${{ steps.prep.outputs.tag }} - Keep Windows awake only while your app is working" --notes-file notes.md
